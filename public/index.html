<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseSync - Real-Time Telemetry Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .top-status-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .login-card { 
            width: 100%;
            max-width: 450px; 
            padding: 35px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
        }
        .sensor-badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        .badge-live { 
            background-color: #e6f4ea; 
            color: #137333; 
        }
        .badge-offline { 
            background-color: #f1f3f4; 
            color: #5f6368; 
        }
        .lock-icon-container {
            width: 60px;
            height: 60px;
            background-color: #e8f0fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        .lock-icon-container svg {
            width: 28px;
            height: 28px;
            fill: #1a73e8;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Dynamic Sensor Status Header Badge -->
        <div class="top-status-container">
            <div id="sensor-status-badge" class="sensor-badge badge-offline">
                <span>•</span>&nbsp;No signal
            </div>
        </div>

        <!-- Secure Login Card -->
        <div class="login-card">
            <div class="lock-icon-container">
                <!-- Secure Padlock Icon SVG -->
                <svg viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>

            <div class="text-center mb-4">
                <h4 class="fw-bold">Welcome to Heart Rate Portal</h4>
                <p class="text-muted small">Sign in to access your telemetry dashboard</p>
            </div>

            <!-- Login Form -->
            <form action="/api/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label fw-semibold small text-secondary">Select Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        // Dynamic Frontend Sensor Badge Updater based on Hardware Feed
        function checkSensorFeed(lastUpdatedTime) {
            const badge = document.getElementById('sensor-status-badge');
            if (!lastUpdatedTime) {
                badge.className = "sensor-badge badge-offline";
                badge.innerHTML = "<span>•</span>&nbsp;No signal";
                return;
            }

            const now = new Date();
            const lastActive = new Date(lastUpdatedTime);
            const diffSeconds = Math.floor((now - lastActive) / 1000);

            if (diffSeconds > 10) {
                badge.className = "sensor-badge badge-offline";
                badge.innerHTML = `<span>•</span>&nbsp;No signal (Last updated ${diffSeconds}s ago)`;
            } else {
                badge.className = "sensor-badge badge-live";
                badge.innerHTML = "<span>•</span>&nbsp;Live Sensor Feed";
            }
        }

        // Poll backend session and hardware telemetry status every 3 seconds
        async function fetchSensorStatus() {
            try {
                const response = await fetch('/api/arduino/status');
                const data = await response.json();
                checkSensorFeed(data.last_updated);
            } catch (err) {
                console.error("Error communicating with telemetry endpoint", err);
            }
        }

        // Initial check and interval polling loop
        fetchSensorStatus();
        setInterval(fetchSensorStatus, 3000);
    </script>
</body>
</html>
